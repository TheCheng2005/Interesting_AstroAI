<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First 1000 WW Images</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    #status {
      margin-bottom: 20px;
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #111;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }

    .meta {
      font-size: 13px;
      line-height: 1.45;
      color: #333;
      word-break: break-word;
    }

    .meta strong {
      color: #000;
    }

    .score {
      margin-top: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>First 1000 WW Images</h1>
  <div id="status">Loading CSV...</div>
  <div id="imageGrid" class="grid"></div>

  <script>
    const CSV_FILE = "all_ww_data.csv";
    const MAX_IMAGES = 1000;

    async function loadCSV() {
      const response = await fetch(CSV_FILE);

      if (!response.ok) {
        throw new Error(`Could not load ${CSV_FILE}`);
      }

      const text = await response.text();
      return parseCSV(text);
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = lines[0].split(",").map(h => h.trim());

      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);

        if (values.length !== headers.length) {
          console.warn("Skipping malformed row:", lines[i]);
          continue;
        }

        const row = {};
        headers.forEach((header, index) => {
          row[header] = values[index];
        });

        rows.push(row);
      }

      return rows;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current.trim());
      return result;
    }

    function renderImages(rows) {
      const grid = document.getElementById("imageGrid");
      const status = document.getElementById("status");

      const firstRows = rows.slice(0, MAX_IMAGES);

      status.textContent = `Loaded ${firstRows.length} images from ${CSV_FILE}`;

      grid.innerHTML = "";

      firstRows.forEach((row, index) => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = row.URL;
        img.alt = row.filename || `Image ${index + 1}`;
        img.loading = "lazy";

        const meta = document.createElement("div");
        meta.className = "meta";

        meta.innerHTML = `
          <div><strong>#${index + 1}</strong></div>
          <div><strong>Filename:</strong> ${row.filename}</div>
          <div><strong>Subject ID:</strong> ${row.subject_id}</div>
          <div><strong>RA:</strong> ${Number(row.RA).toFixed(5)}</div>
          <div><strong>Dec:</strong> ${Number(row.Dec).toFixed(5)}</div>
          <div class="score">Anomaly Score: ${Number(row.anomaly_score).toFixed(3)}</div>
          <div>Image Score: ${Number(row.image_score).toFixed(3)}</div>
          <div>Feature Score: ${Number(row.feature_score).toFixed(3)}</div>
          <div>Percent Selected: ${Number(row.percent_selected).toFixed(3)}</div>
        `;

        card.appendChild(img);
        card.appendChild(meta);
        grid.appendChild(card);
      });
    }

    loadCSV()
      .then(renderImages)
      .catch(error => {
        console.error(error);
        document.getElementById("status").textContent =
          "Error loading CSV. Make sure all_ww_data.csv is in the same folder and you are using a local server.";
      });
  </script>
</body>
</html>
